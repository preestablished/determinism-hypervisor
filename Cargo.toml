[workspace]
members = [
    "crates/dh-detclock",
    "crates/dh-devices",
    "crates/dh-inputlog",
    "crates/dh-proto",
    "crates/dh-snapshot",
    "crates/dh-verify",
    "crates/dh-vmm",
    "crates/dh-worker",
    "tests/nanokernel",
    "tools/dh-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
blake3 = "1"
determinism-proto = { path = "../control-plane/crates/determinism-proto", default-features = false }
# detchannel host side (guest-sdk Ms1): sibling-repo path deps, same pattern
# as determinism-proto -> ../control-plane. detguest-wire is needed alongside
# detguest-host because the ChannelWriteSink trait signature takes
# detguest_wire::RingId, which detguest-host does not re-export.
detguest-host = { path = "../guest-sdk/crates/detguest-host" }
detguest-wire = { path = "../guest-sdk/crates/detguest-wire" }
dh-detclock = { path = "crates/dh-detclock" }
dh-devices = { path = "crates/dh-devices" }
dh-inputlog = { path = "crates/dh-inputlog" }
dh-proto = { path = "crates/dh-proto" }
dh-snapshot = { path = "crates/dh-snapshot" }
dh-verify = { path = "crates/dh-verify" }
dh-vmm = { path = "crates/dh-vmm" }
dh-worker = { path = "crates/dh-worker" }
