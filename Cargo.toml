[workspace]
members = [
    "crates/dh-detclock",
    "crates/dh-devices",
    "crates/dh-inputlog",
    "crates/dh-proto",
    "crates/dh-snapshot",
    "crates/dh-verify",
    "crates/dh-vmm",
    "crates/dh-worker",
    "tests/determinism",
    "tests/nanokernel",
    "tools/dh-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
blake3 = "1"
determinism-proto = { path = "../control-plane/crates/determinism-proto", default-features = false }
# detchannel host side (guest-sdk Ms1): sibling-repo path deps, same pattern
# as determinism-proto -> ../control-plane. detguest-wire is needed alongside
# detguest-host because the ChannelWriteSink trait signature takes
# detguest_wire::RingId, which detguest-host does not re-export.
detguest-host = { path = "../guest-sdk/crates/detguest-host" }
detguest-wire = { path = "../guest-sdk/crates/detguest-wire" }
dh-detclock = { path = "crates/dh-detclock" }
dh-devices = { path = "crates/dh-devices" }
dh-inputlog = { path = "crates/dh-inputlog" }
dh-proto = { path = "crates/dh-proto" }
dh-snapshot = { path = "crates/dh-snapshot" }
dh-verify = { path = "crates/dh-verify" }
dh-vmm = { path = "crates/dh-vmm" }
dh-worker = { path = "crates/dh-worker" }
# snapshot-store M4 integration seam (gate bead 4nj): third sibling-repo path
# dep, same pattern as determinism-proto/detguest-host. Until the M4 store
# integration lands a runtime consumer, the only consumer is dh-snapshot's
# snapstore_readiness dev-dep surface-pin test. CI lanes must check out
# ../snapshot-store (path deps resolve at cargo-metadata time).
snapstore-client = { path = "../snapshot-store/crates/snapstore-client" }
# R12 joint testing (decision: docs/decisions/snapstore-server-for-tests.md):
# tests spawn the REAL server in-process via its serve_for_tests seam.
snapstore-manifest = { path = "../snapshot-store/crates/snapstore-manifest" }
snapstore-types = { path = "../snapshot-store/crates/snapstore-types" }
snapstore-server = { path = "../snapshot-store/crates/snapstore-server" }
criterion = "0.5"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# KVM-facing FFI surface, one pinned closure for every member (iteration-75
# review hygiene: these literals were drifting toward five copies).
kvm-ioctls = "0.24.0"
libc = "0.2.186"
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
# proto codegen for the API.md §2 surface (docs/decisions/proto-seam.md):
# versions track ../snapshot-store's workspace so the lockfile shares one
# tonic/prost closure. protoc is vendored — no runner provisioning needed.
prost = "0.13"
protoc-bin-vendored = "3"
tonic = "0.12"
tonic-build = "0.12"
