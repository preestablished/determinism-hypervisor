[package]
name = "dh-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
detguest-host.workspace = true
detguest-wire.workspace = true
dh-detclock.workspace = true
dh-devices.workspace = true
dh-inputlog.workspace = true
dh-proto.workspace = true
dh-verify.workspace = true
dh-vmm.workspace = true

# x86_64-only (bead v5w): all lib modules are cfg-gated; these deps are
# only reachable from them.
[target.'cfg(target_arch = "x86_64")'.dependencies]
kvm-bindings = "0.14.0"
libc.workspace = true
kvm-ioctls.workspace = true
tokio.workspace = true
tonic.workspace = true
vm-memory.workspace = true
# The embedded test guests: the debug CLI ships them for boot/run/skid.
nanokernel = { path = "../../tests/nanokernel" }

[dev-dependencies]

[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
tokio-stream = { workspace = true, features = ["net"] }
