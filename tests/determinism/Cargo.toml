[package]
name = "determinism-tests"
version.workspace = true
edition.workspace = true
license.workspace = true

# The standing determinism regression suite (ARCH §1 tests/determinism).
# Live KVM tests gate in the kvm-intel lane and self-skip elsewhere.
[dependencies]

[dev-dependencies]
dh-detclock.workspace = true
dh-verify.workspace = true
dh-vmm.workspace = true

# x86_64-only (bead v5w): every test target here gates to empty on other
# arches, so the KVM plumbing need not even compile there.
[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
blake3.workspace = true
detguest-host.workspace = true
detguest-wire.workspace = true
dh-devices.workspace = true
dh-inputlog.workspace = true
kvm-bindings = "0.14.0"
kvm-ioctls.workspace = true
nanokernel = { path = "../nanokernel" }
libc.workspace = true
vm-memory.workspace = true
# R12 joint tests against the REAL snapshot-store, spawned in-process
# (decision: docs/decisions/snapstore-server-for-tests.md).
snapstore-client.workspace = true
snapstore-manifest.workspace = true
snapstore-server.workspace = true
tempfile.workspace = true
tokio.workspace = true
