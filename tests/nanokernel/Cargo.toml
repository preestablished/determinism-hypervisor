[package]
name = "nanokernel"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

# No dependencies: the crate is the build pipeline (build.rs assembles and
# links the freestanding guests) plus the BootInfo ABI constants and the
# include_bytes! accessors for the built ELFs.
[dependencies]
blake3.workspace = true

# Interop test only: attach the exact channel page the device-exercise
# guest builds through the real host-side code.
[dev-dependencies]
detguest-host.workspace = true
detguest-wire.workspace = true
# pad_echo's drift test pins the asm register offsets against the
# DEVICE-SIDE truth (dh-devices pad constants), not re-typed literals.
dh-devices.workspace = true
