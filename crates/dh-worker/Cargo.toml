[package]
name = "dh-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dh-detclock.workspace = true
dh-devices.workspace = true
dh-inputlog.workspace = true
dh-proto.workspace = true
dh-snapshot.workspace = true
dh-verify.workspace = true
dh-vmm.workspace = true

# The snapshot engine (src/snapshot_engine.rs) talks to the REAL store
# (R12) through the blocking facade; x86-only alongside the KVM seams.
[target.'cfg(target_arch = "x86_64")'.dependencies]
snapstore-client.workspace = true
snapstore-manifest.workspace = true
snapstore-types.workspace = true
vm-memory.workspace = true

[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
# The M4 transparency acceptance (tests/m4_transparency.rs) drives real
# segments on the landing-loop guest; it lives HERE because ARCH §1's
# "nothing depends on dh-worker" rule forbids tests/determinism from
# importing the engines.
kvm-ioctls.workspace = true
libc.workspace = true
nanokernel = { path = "../../tests/nanokernel" }
snapstore-server.workspace = true
tempfile.workspace = true
tokio.workspace = true

# Criterion perf benches (bead 9sb): fork / incremental snapshot /
# restore latency distributions for the nightly perf-gate job (bead
# 1pa, >20% regression fails). The p50 ACCEPTANCE thresholds live in
# tests/perf_gates.rs; this target is the trend instrument.
[target.'cfg(target_arch = "x86_64")'.dev-dependencies.criterion]
workspace = true

[[bench]]
name = "perf_gates"
harness = false
