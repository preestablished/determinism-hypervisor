name: ci
on:
  # pull_request covers PR branches; push is limited to main (post-merge
  # verification) so every PR commit isn't built twice.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref; superseded runs are cancelled (keeps the single
# self-hosted box from queueing stale work).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both jobs need the sibling repos next to this checkout: the workspace has
# path deps on ../control-plane (determinism-proto), ../guest-sdk
# (detguest-host, detguest-wire), and ../snapshot-store (snapstore-client).
# Sibling HEAD wins — there is no rev pinning.
jobs:
  # Host-runnable lane: fmt, clippy, build, and the unit-layer tests. Runs on
  # x86_64 and aarch64 — Spark-side devs touch shared code, so the shared
  # crates must build/run on arm. KVM-requiring tests guard on /dev/kvm at
  # runtime and self-skip here.
  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            cargo-args: --workspace
          # The KVM-touching dh-vmm modules (and dh-cli's lib) are
          # cfg(target_arch = "x86_64")-gated (bead v5w), so the whole
          # workspace builds here too: the arm lane tests the pure
          # determinism math (agenda, vt, config, blkfile) plus all the
          # shared crates; the live-KVM tests compile to empty.
          - runner: ubuntu-24.04-arm
            cargo-args: --workspace
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/control-plane
          path: control-plane
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/guest-sdk
          path: guest-sdk
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/snapshot-store
          path: snapshot-store
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # tests/nanokernel's build.rs assembles the test guests with nasm
      # (cross-assembles x86 on the arm runner too; linking falls back to
      # the sysroot rust-lld there). Both host lanes are GitHub-hosted
      # Ubuntu images: passwordless sudo + apt are part of that contract.
      - run: which nasm || { sudo apt-get update && sudo apt-get install -y nasm; }
      # NOT `cargo fmt --all`: cargo-fmt's --all also formats local path
      # dependencies, i.e. the sibling checkouts (control-plane, guest-sdk),
      # whose formatting must not gate this repo's CI. Scope to our members,
      # fail-closed: at the virtual-manifest root, `cargo fmt --check` with
      # an empty package list exits 0 having checked nothing.
      - run: |
          set -euo pipefail
          members=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          test -n "$members"
          cargo fmt --check $(printf -- '--package %s ' $members)
        working-directory: repo
      - run: cargo clippy ${{ matrix.cargo-args }} --all-targets -- -D warnings
        working-directory: repo
      - run: cargo build ${{ matrix.cargo-args }}
        working-directory: repo
      - run: cargo test ${{ matrix.cargo-args }}
        working-directory: repo

  # KVM-gated lane: same suite on the Intel box with /dev/kvm, where the
  # live-KVM tests (vcpu run loops, MSR filter #GP, timer determinism) stop
  # self-skipping and actually exercise the hypervisor.
  kvm-intel:
    # Public repo + self-hosted runner: never let fork PRs onto the box.
    # Same-repo pushes and same-repo PRs only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, kvm-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/control-plane
          path: control-plane
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/guest-sdk
          path: guest-sdk
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/snapshot-store
          path: snapshot-store
      - uses: dtolnay/rust-toolchain@stable
      # rw, matching what Kvm::new() and the test guards need — a read-only
      # grant would silently skip every live leg while the lane stays green.
      - run: test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm || { echo "::error::/dev/kvm not available/rw on runner"; exit 1; }
      # nasm is part of the box's provisioning (bead 6eb docs/ops); fail
      # loudly here if a reprovision dropped it rather than deep in build.rs.
      - run: which nasm || { echo "::error::nasm missing on kvm-intel runner (provisioning drift)"; exit 1; }
      - run: cargo build --workspace
        working-directory: repo
      - run: cargo test --workspace
        working-directory: repo
      - name: M8 bounded replay-commit ref identity
        env:
          DH_M7_ACCEPT_JOBS: "8"
          DH_M7_ACCEPT_SLOT_CORES: "2-5"
          DH_M7_ACCEPT_ALLOW_SKIP: "0"
          M8_STORE_ROOT: ${{ runner.temp }}/m8-store-${{ github.run_id }}
          M8_EVIDENCE_ROOT: ${{ runner.temp }}/m8-evidence-${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf "$M8_STORE_ROOT" "$M8_EVIDENCE_ROOT"
          mkdir -p "$M8_STORE_ROOT" "$M8_EVIDENCE_ROOT"
          taskset -c "$DH_M7_ACCEPT_SLOT_CORES" cargo test -p dh-worker --lib \
            take_snapshot_rolls_full_manifest_and_restore_accepts_baseline_delta \
            -- --nocapture --test-threads=1
          touch "$M8_EVIDENCE_ROOT/full-cadence-smoke.ok"
          taskset -c "$DH_M7_ACCEPT_SLOT_CORES" cargo test -p dh-worker --test m7_fork_verify --release \
            m8_accept_semantic_negative_replay_commit_ref_mismatch \
            -- --ignored --nocapture --test-threads=1
          taskset -c "$DH_M7_ACCEPT_SLOT_CORES" cargo test -p dh-worker --test m7_fork_verify --release \
            m8_accept_1000_seeded_forks_replay_commit_ref_identity \
            -- --ignored --nocapture --test-threads=1
          python3 ../snapshot-store/scripts/m8_joint_fork_integrity_evidence.py "$M8_EVIDENCE_ROOT"
        working-directory: repo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m8-ref-identity-bounded-${{ github.run_id }}
          path: ${{ runner.temp }}/m8-evidence-${{ github.run_id }}
          if-no-files-found: ignore
