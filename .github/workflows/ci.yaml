name: ci
on:
  # pull_request covers PR branches; push is limited to main (post-merge
  # verification) so every PR commit isn't built twice.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref; superseded runs are cancelled (keeps the single
# self-hosted box from queueing stale work).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both jobs need the sibling repos next to this checkout: the workspace has
# path deps on ../control-plane (determinism-proto) and ../guest-sdk
# (detguest-host, detguest-wire). Sibling HEAD wins — there is no rev pinning.
jobs:
  # Host-runnable lane: fmt, clippy, build, and the unit-layer tests. Runs on
  # x86_64 and aarch64 — Spark-side devs touch shared code, so the shared
  # crates must build/run on arm. KVM-requiring tests guard on /dev/kvm at
  # runtime and self-skip here.
  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            cargo-args: --workspace
          # dh-vmm consumes x86_64-only kvm-bindings APIs (MSR filter, CPUID)
          # with no cfg gates, so it and its dependents (dh-worker, dh-cli)
          # cannot build on aarch64. The arm lane covers the shared crates;
          # making the agenda/vt math arm-buildable is tracked in beads.
          - runner: ubuntu-24.04-arm
            cargo-args: --workspace --exclude dh-vmm --exclude dh-worker --exclude dh-cli
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/control-plane
          path: control-plane
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/guest-sdk
          path: guest-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # NOT `cargo fmt --all`: cargo-fmt's --all also formats local path
      # dependencies, i.e. the sibling checkouts (control-plane, guest-sdk),
      # whose formatting must not gate this repo's CI. Scope to our members.
      - run: cargo fmt --check $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | sed 's/^/--package /' | tr '\n' ' ')
        working-directory: repo
      - run: cargo clippy ${{ matrix.cargo-args }} --all-targets -- -D warnings
        working-directory: repo
      - run: cargo build ${{ matrix.cargo-args }}
        working-directory: repo
      - run: cargo test ${{ matrix.cargo-args }}
        working-directory: repo

  # KVM-gated lane: same suite on the Intel box with /dev/kvm, where the
  # live-KVM tests (vcpu run loops, MSR filter #GP, timer determinism) stop
  # self-skipping and actually exercise the hypervisor.
  kvm-intel:
    # Public repo + self-hosted runner: never let fork PRs onto the box.
    # Same-repo pushes and same-repo PRs only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, kvm-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/control-plane
          path: control-plane
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/guest-sdk
          path: guest-sdk
      - uses: dtolnay/rust-toolchain@stable
      - run: test -c /dev/kvm && test -r /dev/kvm || { echo "::error::/dev/kvm not available/readable on runner"; exit 1; }
      - run: cargo build --workspace
        working-directory: repo
      - run: cargo test --workspace
        working-directory: repo
