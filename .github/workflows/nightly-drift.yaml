# Nightly determinism-class drift check (bead q10) + the determinism
# canary. Fails if the kvm-intel runner's host tuple drifted from
# ci/determinism-class.lock without a deliberate, reviewed bump (the
# apt-mark hold makes drift a deliberate act; the re-baseline procedure
# lives in docs/ops/host-config-intel-box.md).
name: nightly-drift
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC nightly
  workflow_dispatch:
    inputs:
      # The M5-accept 24h fuzz run is an OPERATOR dispatch (bead 1j4):
      #   gh workflow run nightly-drift.yaml -f fuzz_seconds=86400 -f fuzz_runner=kvm-intel
      # GitHub-hosted jobs hard-cap at 6h, so a >21600s run MUST set
      # fuzz_runner=kvm-intel (self-hosted; no 6h cap). Know what the
      # 24h dispatch costs: it holds this workflow's concurrency group
      # AND the single kvm-intel runner for the duration, so the 03:17
      # scheduled drift/canary run queues behind it and lands up to
      # ~24h late (delayed, not dropped — cancel-in-progress is false).
      # Timely drift detection is blanked out for that day: schedule
      # the dispatch deliberately.
      fuzz_seconds:
        description: "DHILOG fuzz duration, seconds (24h accept run: 86400; >21600 REQUIRES fuzz_runner=kvm-intel or GitHub's 6h hosted cap kills the job and files a false failure issue)"
        required: false
        default: "3600"
      fuzz_runner:
        description: "Fuzz job runner label: ubuntu-latest or kvm-intel (exactly these — a typo'd label strands the run queued until the 25h timeout while holding the concurrency group)"
        required: false
        default: "ubuntu-latest"

# Queue hygiene on the single kvm-intel runner; never cancel in flight —
# this is the measurement workflow (docs/ops/github-runner.md caveat).
concurrency:
  group: kvm-intel-nightly-drift
  cancel-in-progress: false

jobs:
  determinism-class:
    # Scheduled runs only execute on the default branch; the runner is
    # the lab box itself — exactly the host the lock describes.
    runs-on: [self-hosted, kvm-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: drift check
        run: bash repo/ci/check-determinism-class.sh

  determinism-canary:
    # The 1e9-twice regression as the nightly canary: catches a
    # semantic drift the host tuple cannot (e.g. a KVM behavior change
    # within the same kernel package).
    needs: determinism-class
    runs-on: [self-hosted, kvm-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/control-plane
          path: control-plane
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/guest-sdk
          path: guest-sdk
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/snapshot-store
          path: snapshot-store
      - uses: dtolnay/rust-toolchain@stable
      - run: test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm || { echo "::error::/dev/kvm not available/rw"; exit 1; }
      - run: which nasm || { echo "::error::nasm missing (provisioning drift)"; exit 1; }
      - name: run-twice determinism regression + counting empirics
        run: cargo test -p determinism-tests --test regression --test counting_semantics --test counting_smoke
        working-directory: repo

  record-replay-corpus:
    # Replays checked-in corpus bytes against the locked determinism class:
    # root RAM image + DHSNAP + DHILOG + expected epoch hashes. This is the
    # nightly tripwire that catches behavioral drift without regenerating the
    # recording. A deliberate ci/determinism-class.lock bump must re-baseline
    # the corpus in the same reviewed commit.
    needs: determinism-class
    runs-on: [self-hosted, kvm-intel]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/control-plane
          path: control-plane
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/guest-sdk
          path: guest-sdk
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/snapshot-store
          path: snapshot-store
      - uses: dtolnay/rust-toolchain@stable
      - run: test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm || { echo "::error::/dev/kvm not available/rw"; exit 1; }
      - run: which nasm || { echo "::error::nasm missing (provisioning drift)"; exit 1; }
      - name: re-verify checked-in record/replay corpus
        run: cargo test -p dh-worker --test m5_record_replay record_replay_corpus_pad_echo_6s_reverifies -- --nocapture
        working-directory: repo

  # 1h libFuzzer budget over the DHILOG read and splice paths (beads
  # 1j4, 6zm): arbitrary bytes -> LogReader::parse / Lineage
  # composition; the invariant is no panics / no unbounded allocation on
  # hostile input. Hosted by default — fuzzing needs no KVM and must not
  # occupy the kvm-intel box. The shell splits fuzz_seconds across both
  # targets so the operator 24h dispatch remains a 24h wall-clock job.
  dhilog-fuzz:
    runs-on: ${{ inputs.fuzz_runner || 'ubuntu-latest' }}
    # Expressions have no arithmetic, so one ceiling serves every
    # duration: 25h covers the 24h dispatch + grace; hosted runs are
    # additionally capped at 6h by GitHub regardless of this value.
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: dtolnay/rust-toolchain@nightly
      - run: command -v cargo-fuzz || cargo install cargo-fuzz --locked
      # Corpus persists across nightlies (else every run restarts from
      # the 2 golden seeds and discovers nothing cumulatively). Cache is
      # default-branch-scoped with opaque fuzz inputs — acceptable
      # poisoning surface for this public repo.
      - uses: actions/cache@v4
        with:
          path: repo/crates/dh-inputlog/fuzz/corpus/dhilog_parse
          key: dhilog-fuzz-corpus-dhilog_parse-${{ github.run_id }}
          restore-keys: dhilog-fuzz-corpus-dhilog_parse-
      - uses: actions/cache@v4
        with:
          path: repo/crates/dh-inputlog/fuzz/corpus/dhilog_splice
          key: dhilog-fuzz-corpus-dhilog_splice-${{ github.run_id }}
          restore-keys: dhilog-fuzz-corpus-dhilog_splice-
      - name: ensure corpus directories exist
        working-directory: repo/crates/dh-inputlog
        run: mkdir -p fuzz/corpus/dhilog_parse fuzz/corpus/dhilog_splice
      - name: seed fixtures must exist and be non-empty
        working-directory: repo/crates/dh-inputlog
        run: test -s tests/fixtures/v1_minimal.dhilog && test -s tests/fixtures/v1_kitchen_sink.dhilog
      - name: fuzz DHILOG parser and splice
        working-directory: repo/crates/dh-inputlog
        run: |
          set -euo pipefail
          total_seconds="${{ inputs.fuzz_seconds || '3600' }}"
          case "$total_seconds" in
            ''|*[!0-9]*)
              echo "::error::fuzz_seconds must be a positive integer, got '$total_seconds'"
              exit 1
              ;;
          esac
          if [ "$total_seconds" -lt 2 ]; then
            total_seconds=2
          fi
          parse_seconds=$(( total_seconds / 2 ))
          splice_seconds=$(( total_seconds - parse_seconds ))
          echo "DHILOG fuzz budget: ${parse_seconds}s parser + ${splice_seconds}s splice = ${total_seconds}s total"
          cargo +nightly fuzz run dhilog_parse fuzz/corpus/dhilog_parse tests/fixtures \
            -- -max_total_time="$parse_seconds" -rss_limit_mb=4096
          cargo +nightly fuzz run dhilog_splice fuzz/corpus/dhilog_splice tests/fixtures \
            -- -max_total_time="$splice_seconds" -rss_limit_mb=4096
      - name: keep crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dhilog-fuzz-artifacts
          path: repo/crates/dh-inputlog/fuzz/artifacts/

  # A silent-red nightly is the worst outcome for a determinism product:
  # route failures to a visible issue (updated, not duplicated).
  alert-on-failure:
    needs: [determinism-class, determinism-canary, record-replay-corpus, dhilog-fuzz]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"
          TITLE="nightly-drift FAILED: determinism class, corpus, canary, or DHILOG fuzz"
          BODY="Nightly failure: $RUN_URL — host drift means the re-baseline procedure (docs/ops/host-config-intel-box.md); a corpus/canary failure is a P0 determinism divergence; a dhilog-fuzz failure has its crashing input in the run's dhilog-fuzz-artifacts upload."
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "in:title nightly-drift FAILED" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi
